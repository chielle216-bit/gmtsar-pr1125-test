name: GMTSAR PR1125 Linux Conda RS2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-conda-rs2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout PR 1125 commit
        uses: actions/checkout@v6
        with:
          repository: gmtsar/gmtsar
          ref: aa0aa0f1b2b85d130aa8f068a4a6d5c1686f7e9f
          path: gmtsar-pr1125
          persist-credentials: false

      - name: Verify clean Linux runner
        working-directory: gmtsar-pr1125
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          cat /etc/os-release
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = \
            "aa0aa0f1b2b85d130aa8f068a4a6d5c1686f7e9f"

          if command -v p2p_processing; then
            echo "Unexpected existing GMTSAR installation"
            exit 1
          fi

          if command -v gmtsar_sharedir.csh; then
            echo "Unexpected existing GMTSAR installation"
            exit 1
          fi

          test -z "${GMTSAR:-}"

      - name: Install bare Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: latest
          auto-activate: true
          activate-environment: ""

      - name: Show initial Conda state
        shell: bash -el {0}
        run: |
          conda --version
          conda info
          conda env list

      - name: Install from README
        working-directory: gmtsar-pr1125
        shell: bash -el {0}
        run: |
          set -euxo pipefail
          python3 gmtsar/python/install.py --system conda-linux-full

      - name: Sanity checks
        working-directory: gmtsar-pr1125
        shell: bash -el {0}
        run: |
          conda activate gmtsar
          set -exo pipefail

          export GMTSAR="$PWD"
          export PATH="$GMTSAR/bin:$PATH"

          command -v python3
          command -v gmt
          command -v p2p_processing
          command -v gmtsar_sharedir.csh
          gmt --version
          gmtsar_sharedir.csh

          p2p_processing || true

      - name: Run RS2 Hawaii sweep
        working-directory: gmtsar-pr1125
        shell: bash -el {0}
        run: |
          conda activate gmtsar
          set -exo pipefail

          export GMTSAR="$PWD"
          export PATH="$GMTSAR/bin:$PATH"

          python3 gmtsar/python/tests/sweep.py \
            --fast \
            --cases RS2_SLC_Hawaii

      - name: Validate comparison results
        working-directory: gmtsar-pr1125
        shell: bash -el {0}
        run: |
          conda activate gmtsar
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "gmtsar/python/work/results/RS2_SLC_Hawaii.json"
          )
          data = json.loads(path.read_text())
          comparisons = [
              item for item in data.get("comparisons", [])
              if item.get("pair") == "py-vs-csh"
          ]
          failures = [
              item for item in comparisons
              if item.get("status") != "SUCCESS"
          ]

          print(f"comparisons: {len(comparisons)}")
          for item in comparisons:
              print(item.get("file"), item.get("status"))

          if len(comparisons) < 6:
              raise SystemExit(
                  f"Expected at least 6 comparisons, got {len(comparisons)}"
              )
          if failures:
              raise SystemExit(f"Comparison failures: {failures}")

          print("RS2_SLC_Hawaii: all comparisons SUCCESS")
          PY

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gmtsar-pr1125-linux-rs2-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            gmtsar-pr1125/gmtsar/python/install_logs/
            gmtsar-pr1125/gmtsar/python/work/sweep.log
            gmtsar-pr1125/gmtsar/python/work/sweep_summary.md
            gmtsar-pr1125/gmtsar/python/work/results/
            gmtsar-pr1125/gmtsar/python/work/csh_test/RS2_SLC_Hawaii/log.txt
            gmtsar-pr1125/gmtsar/python/work/python_test/RS2_SLC_Hawaii/log.txt
